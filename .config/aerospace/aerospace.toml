# AeroSpace configuration inspired by Omarchy/Hyprland workflow
# Place file contents in ~/.config/aerospace/aerospace.toml
# After installing, run: aerospace reload-config

# Gaps between windows (smaller for tighter layout like Omarchy)
[gaps]
inner.horizontal = 4
inner.vertical =   4
outer.left =       4
outer.top =        4
outer.right =      4
outer.bottom =     4

# Main workspace configuration

# Floating windows (exceptions for dialogs, etc.)
'floating' = [
  { title = '.*Preferences.*' },
  { title = '.*Settings.*' },
  { title = '.*About.*' },
  { app-id = 'com.apple.systempreferences' },
  { app-id = 'com.apple.finder' },
]

# Auto-layout enable
'auto-layout' = true

# Window title appearance and startup commands
[exec]
inherit-env-vars = true
after-startup-command = [
  'exec-and-forget sketchybar',
  'exec-and-forget borders active_color=0xfffda1a0 inactive_color=0xff404040 width=3.0 style=round'
]

# Main mode bindings - Super (Cmd) as primary modifier like Omarchy
[mode.main.binding]
# === WINDOW NAVIGATION (Super + Arrow keys - like Hyprland) ===
cmd-h = 'focus left'
cmd-j = 'focus down'
cmd-k = 'focus up'
cmd-l = 'focus right'

# === WINDOW MOVEMENT (Super + Shift + Arrow - like Hyprland) ===
cmd-shift-h = 'move left'
cmd-shift-j = 'move down'
cmd-shift-k = 'move up'
cmd-shift-l = 'move right'

# === WINDOW CONTROL (Omarchy style) ===
cmd-w = 'close'
cmd-f = 'fullscreen'
cmd-shift-f = 'layout floating tiling'
cmd-t = 'layout floating'  # Toggle floating

# === WORKSPACE NAVIGATION (Cmd + Letter for named workspaces) ===
cmd-f = 'workspace 1'  # Finder workspace
cmd-b = 'workspace 2'  # Browser workspace  
cmd-n = 'workspace 3'  # Notes/Editor workspace
cmd-t = 'workspace 4'  # Terminal workspace
cmd-c = 'workspace 5'  # Communication workspace
cmd-z = 'workspace 6'  # Meetings workspace
cmd-m = 'workspace 7'  # Mail workspace
cmd-d = 'workspace 8'  # Design workspace
cmd-1 = 'workspace 9'  # Extra workspace 1
cmd-2 = 'workspace 10' # Extra workspace 2

# === NUMERIC WORKSPACE NAVIGATION (Backup) ===
cmd-alt-1 = 'workspace 1'
cmd-alt-2 = 'workspace 2'
cmd-alt-3 = 'workspace 3'
cmd-alt-4 = 'workspace 4'
cmd-alt-5 = 'workspace 5'
cmd-alt-6 = 'workspace 6'
cmd-alt-7 = 'workspace 7'
cmd-alt-8 = 'workspace 8'
cmd-alt-9 = 'workspace 9'
cmd-alt-0 = 'workspace 10'

# === WORKSPACE SWITCHING ===
cmd-tab = 'workspace-back-and-forth'  # Cmd + Tab

# === MOVE TO WORKSPACE (Cmd + Alt + 1-9/0) ===
cmd-alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
cmd-alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
cmd-alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
cmd-alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
cmd-alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
cmd-alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
cmd-alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
cmd-alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
cmd-alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']
cmd-alt-shift-0 = ['move-node-to-workspace 10', 'workspace 10']

# === LAYOUT MANAGEMENT (Alt for layouts like Omarchy) ===
alt-s = ['layout v_accordion', 'mode service']
alt-l = ['layout h_accordion', 'mode service'] 
alt-e = ['layout tiles horizontal vertical', 'mode service']
alt-w = ['layout tiles', 'mode service']

# === WINDOW RESIZING ===
cmd-minus = 'resize smart -50'
cmd-equal = 'resize smart +50'
cmd-shift-minus = 'resize width -50'
cmd-shift-equal = 'resize width +50'

# === APPLICATION LAUNCHER (Super + Space like Omarchy) ===
cmd-space = 'exec-and-forget open -a Raycast'

# === REMOVED APP LAUNCHING ===
# App launching moved to Raycast with Cmd+Shift+Letter shortcuts
# No conflicts with workspace navigation

# === SYSTEM CONTROLS ===
cmd-ctrl-l = 'exec-and-forget pmset displaysleepnow'  # Lock screen
cmd-ctrl-q = 'exec-and-forget osascript -e "tell application \\"System Events\\" to restart"'  # Restart

# === MONITOR CONTROLS ===
cmd-ctrl-1 = 'move-workspace-to-monitor 1'
cmd-ctrl-2 = 'move-workspace-to-monitor 2'

# Service mode bindings
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
q = ['mode main']

# Join windows (advanced window management)
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']  
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# Application workspace assignments (like Hyprland window rules)
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = ['move-node-to-workspace 1']

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = ['move-node-to-workspace 2']

[[on-window-detected]]
if.app-id = 'com.neovide.neovide'
run = ['move-node-to-workspace 3']

[[on-window-detected]]
if.app-id = 'com.googlecode.iterm2'
run = ['move-node-to-workspace 4']

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = ['move-node-to-workspace 5']

[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = ['move-node-to-workspace 6']

[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = ['move-node-to-workspace 7']

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace 8']

[[on-window-detected]]
if.app-id = 'com.figma.Desktop'
run = ['move-node-to-workspace 9']