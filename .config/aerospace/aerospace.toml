# AeroSpace configuration inspired by Omarchy/Hyprland workflow
# Place file contents in ~/.config/aerospace/aerospace.toml
# After installing, run: aerospace reload-config

# Gaps between windows (smaller for tighter layout like Omarchy)
[gaps]
inner.horizontal = 4
inner.vertical =   4
outer.left =       4
outer.top =        4
outer.right =      4
outer.bottom =     4

# Main workspace configuration

# Floating windows (exceptions for dialogs, etc.)
'floating' = [
  { title = '.*Preferences.*' },
  { title = '.*Settings.*' },
  { title = '.*About.*' },
  { app-id = 'com.apple.systempreferences' },
  { app-id = 'com.apple.finder' },
]

# Auto-layout enable
'auto-layout' = true

# Window title appearance and startup commands
[exec]
inherit-env-vars = true
after-startup-command = [
  'exec-and-forget sketchybar',
  'exec-and-forget borders active_color=0xfffda1a0 inactive_color=0xff404040 width=3.0 style=round',
  # Auto-start apps on correct workspaces with staggered delays
  'exec-and-forget sleep 1 && open -a Finder && aerospace workspace 1',
  'exec-and-forget sleep 2 && open -a Safari && aerospace workspace 2',
  'exec-and-forget sleep 3 && open -a Obsidian && aerospace workspace 3',
  'exec-and-forget sleep 4 && open -a iTerm && aerospace workspace 4',
  'exec-and-forget sleep 5 && open -a Discord && aerospace workspace 5',
  'exec-and-forget sleep 6 && open -a "zoom.us" && aerospace workspace 6',
  'exec-and-forget sleep 7 && open -a "Microsoft Outlook" && aerospace workspace 7',
  'exec-and-forget sleep 8 && open -a Figma && aerospace workspace 8'
]

# Main mode bindings - Super (Cmd) as primary modifier like Omarchy
[mode.main.binding]
# === WINDOW NAVIGATION (Ctrl + Arrow keys - like Hyprland) ===
ctrl-h = 'focus left'
ctrl-j = 'focus down'
ctrl-k = 'focus up'
ctrl-l = 'focus right'

# === WINDOW MOVEMENT (Ctrl + Shift + Arrow - like Hyprland) ===
ctrl-shift-h = 'move left'
ctrl-shift-j = 'move down'
ctrl-shift-k = 'move up'
ctrl-shift-l = 'move right'

# === WINDOW CONTROL (Omarchy style) ===
ctrl-w = 'close'
ctrl-f = 'fullscreen'
ctrl-shift-f = 'layout floating tiling'
ctrl-t = 'layout floating'  # Toggle floating

# === WORKSPACE NAVIGATION (Ctrl + Letter for named workspaces) ===
ctrl-f = 'workspace 1'  # Finder workspace
ctrl-b = 'workspace 2'  # Browser workspace  
ctrl-n = 'workspace 3'  # Notes/Editor workspace
ctrl-t = 'workspace 4'  # Terminal workspace
ctrl-c = 'workspace 5'  # Communication workspace
ctrl-z = 'workspace 6'  # Meetings workspace
ctrl-o = 'workspace 7'  # Mail workspace
ctrl-d = 'workspace 8'  # Design workspace
ctrl-1 = 'workspace 9'  # Extra workspace 1
ctrl-2 = 'workspace 10' # Extra workspace 2

# === NUMERIC WORKSPACE NAVIGATION (Backup) ===
ctrl-alt-1 = 'workspace 1'
ctrl-alt-2 = 'workspace 2'
ctrl-alt-3 = 'workspace 3'
ctrl-alt-4 = 'workspace 4'
ctrl-alt-5 = 'workspace 5'
ctrl-alt-6 = 'workspace 6'
ctrl-alt-7 = 'workspace 7'
ctrl-alt-8 = 'workspace 8'
ctrl-alt-9 = 'workspace 9'
ctrl-alt-0 = 'workspace 10'

# === WORKSPACE SWITCHING ===
ctrl-tab = 'workspace-back-and-forth'  # Ctrl + Tab

# === MOVE TO WORKSPACE (Ctrl + Alt + 1-9/0) ===
ctrl-alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
ctrl-alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
ctrl-alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
ctrl-alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
ctrl-alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
ctrl-alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
ctrl-alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
ctrl-alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
ctrl-alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']
ctrl-alt-shift-0 = ['move-node-to-workspace 10', 'workspace 10']

# === LAYOUT MANAGEMENT (Alt for layouts like Omarchy) ===
alt-s = ['layout v_accordion', 'mode service']
alt-l = ['layout h_accordion', 'mode service'] 
alt-e = ['layout tiles horizontal vertical', 'mode service']
alt-w = ['layout tiles', 'mode service']

# === WINDOW RESIZING ===
ctrl-minus = 'resize smart -50'
ctrl-equal = 'resize smart +50'
ctrl-shift-minus = 'resize width -50'
ctrl-shift-equal = 'resize width +50'

# === APPLICATION LAUNCHER (Ctrl + Space like Omarchy) ===
ctrl-space = 'exec-and-forget open -a Raycast'

# === SYSTEM CONTROLS ===
ctrl-alt-l = 'exec-and-forget pmset displaysleepnow'  # Lock screen
ctrl-alt-q = 'exec-and-forget osascript -e "tell application \\"System Events\\" to restart"'  # Restart

# === MONITOR CONTROLS ===
ctrl-alt-1 = 'move-workspace-to-monitor 1'
ctrl-alt-2 = 'move-workspace-to-monitor 2'

# Service mode bindings
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
q = ['mode main']

# Join windows (advanced window management)
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']  
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# Application workspace assignments (like Hyprland window rules)
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = ['move-node-to-workspace 1']

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = ['move-node-to-workspace 2']

[[on-window-detected]]
if.app-id = 'com.neovide.neovide'
run = ['move-node-to-workspace 3']

[[on-window-detected]]
if.app-id = 'com.googlecode.iterm2'
run = ['move-node-to-workspace 4']

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = ['move-node-to-workspace 5']

[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = ['move-node-to-workspace 6']

[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = ['move-node-to-workspace 7']

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace 8']

[[on-window-detected]]
if.app-id = 'com.figma.Desktop'
run = ['move-node-to-workspace 9']