# Place file contents in ~/.config/aerospace/aerospace.toml
# After installing, run: aerospace reload-config

# Basic AeroSpace config with sensible defaults
# See: https://github.com/nikitabobko/AeroSpace#configuration

# Gaps between windows
[gaps]
inner.horizontal = 8
inner.vertical =   8
outer.left =       8
outer.top =        8
outer.right =      8
outer.bottom =     8

# Window management
[main]
binding-mode = 'work'
gaps.outer.all = 8
gaps.inner.horizontal = 8
gaps.inner.vertical = 8

# Floating windows
# 'floating' = [
#   { title = '.*' }, # All windows
# ]

# Auto-layout
# 'auto-layout' = true

# Window title appearance
[exec]
inherit-env-vars = true
after-startup-command = [
  'exec-and-forget sketchybar',
  'exec-and-forget borders active_color=0xff89b4fa inactive_color=0xff313244 width=5.0'
]

# Workspace layout
# 'workspace-to-monitor-fix' = []

# Normalizations
[mode.main.binding]
alt-s = ['layout v_accordion', 'mode service']
alt-d = ['layout h_accordion', 'mode service']
alt-e = ['layout tiles horizontal vertical', 'mode service']
alt-f = ['fullscreen', 'mode service']
alt-shift-f = ['layout floating tiling', 'mode service']

# Focus navigation
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Window resizing
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Workspaces (1-9, 0)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

# Move windows between workspaces
alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']
alt-shift-0 = ['move-node-to-workspace 10', 'workspace 10']

# Service mode bindings
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
backspace = ['close-all-windows-but-current', 'mode main']
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# Workspace assignments to monitors
# [[on-window-detected]]
# if.app-id = 'com.apple.systempreferences'
# run = ['move-node-to-workspace 10']